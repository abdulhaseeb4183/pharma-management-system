<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pharma ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; }
        .card-header { background-color: #2c3e50; color: white; text-align: center; padding: 30px; }
        .btn-primary { background-color: #3b82f6; border: none; padding: 10px; }
        .btn-primary:hover { background-color: #2563eb; }
        .form-control { border-radius: 8px; padding: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-clinic-medical me-2"></i>Pharma ERP</h3>
                    <p class="mb-0 text-white-50">Admin Login</p>
                </div>
                <div class="card-body p-4">
                    
                    {% if form.errors %}
                        <div class="alert alert-danger text-center p-2 small">
                            Invalid Username or Password
                        </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">USERNAME</label>
                            {{ form.username }}
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">PASSWORD</label>
                            {{ form.password }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold mb-3">SECURE LOGIN</button>
                    </form>

                    <div class="text-center border-top pt-3">
                        <small class="text-muted">Don't have an account?</small><br>
                        <a href="{% url 'register' %}" class="text-decoration-none fw-bold text-dark">Create New Account</a>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3 text-muted small">&copy; 2025 Pharma System</div>
        </div>
    </div>
</div>

</body>
</html>
