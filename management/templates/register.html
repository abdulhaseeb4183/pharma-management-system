<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Pharma ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; }
        .card-header { background-color: #1abc9c; color: white; text-align: center; padding: 25px; }
        .btn-success { background-color: #2c3e50; border: none; padding: 10px; }
        .btn-success:hover { background-color: #1a252f; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header">
                    <h4><i class="fas fa-user-plus me-2"></i>Register New Admin</h4>
                    <p class="mb-0 text-white-50">Join the Pharma System</p>
                </div>
                <div class="card-body p-4">
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold text-uppercase">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <small class="text-danger">{{ field.errors.0 }}</small>
                                {% endif %}
                            </div>
                        {% endfor %}

                        <button type="submit" class="btn btn-success w-100 fw-bold mb-3">CREATE ACCOUNT</button>
                    </form>

                    <div class="text-center border-top pt-3">
                        <small class="text-muted">Already have an account?</small><br>
                        <a href="{% url 'login' %}" class="text-decoration-none fw-bold text-dark">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
